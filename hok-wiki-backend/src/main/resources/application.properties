spring.application.name=hok-wiki-backend

spring.liquibase.change-log=classpath:liquibase/master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

security.jwt.base64-secret=${JWT_BASE64_SECRET}
security.jwt.issuer=${JWT_ISSUER:hok-wiki}
security.jwt.token-validity-in-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
security.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
security.jwt.remember-me-refresh-token-validity-in-seconds=${JWT_REMEMBER_ME_TTL_SECONDS:2592000}
security.jwt.password-reset-validity-in-seconds=${PASSWORD_RESET_TTL_SECONDS:900}
security.jwt.reset-password-url=${PASSWORD_RESET_URL:}
security.jwt.mail-from=${MAIL_FROM:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
