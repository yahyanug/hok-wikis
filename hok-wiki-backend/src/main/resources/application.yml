spring:
  application:
    name: hok-wiki-backend
  liquibase:
    change-log: classpath:liquibase/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  mail:
    host: "${SMTP_HOST:}"
    port: "${SMTP_PORT:587}"
    username: "${SMTP_USERNAME:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      mail.smtp.auth: "${SMTP_AUTH:true}"
      mail.smtp.starttls.enable: "${SMTP_STARTTLS_ENABLED:true}"
      mail.smtp.starttls.required: "${SMTP_STARTTLS_REQUIRED:true}"
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

security:
  jwt:
    base64-secret: "${JWT_BASE64_SECRET}"
    issuer: "${JWT_ISSUER:hok-wiki}"
    token-validity-in-seconds: "${JWT_ACCESS_TOKEN_TTL_SECONDS:900}"
    refresh-token-validity-in-seconds: "${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}"
    remember-me-refresh-token-validity-in-seconds: "${JWT_REMEMBER_ME_TTL_SECONDS:2592000}"
    password-reset-validity-in-seconds: "${PASSWORD_RESET_TTL_SECONDS:900}"
    reset-password-url: "${PASSWORD_RESET_URL:}"
    mail-from: "${MAIL_FROM:}"
