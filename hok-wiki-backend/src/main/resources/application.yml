server:
  address: "${SERVER_ADDRESS:127.0.0.1}"
  port: 8080

spring:
  application:
    name: hok-wiki-backend
  profiles:
    default: local
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:hok-wiki}"
    username: "${POSTGRES_USER:user123}"
    password: "${POSTGRES_PASSWORD:password123}"
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      connect-timeout: 5s
      timeout: 5s
  liquibase:
    change-log: classpath:liquibase/master.xml
    contexts: "${LIQUIBASE_CONTEXTS:prod}"
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

security:
  jwt:
    base64-secret: "${JWT_BASE64_SECRET}"
    issuer: "${JWT_ISSUER:hok-wiki}"
    token-validity-in-seconds: "${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}"
    refresh-token-validity-in-seconds: "${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}"
    remember-me-refresh-token-validity-in-seconds: "${JWT_REMEMBER_ME_TTL_SECONDS:2592000}"

---
# Local API testing defaults. Production uses environment values from Docker.
spring:
  config:
    activate:
      on-profile: local
  liquibase:
    contexts: "${LIQUIBASE_CONTEXTS:local,dataset}"

security:
  jwt:
    # Public development key; never use this key for a VPS deployment.
    base64-secret: "${JWT_BASE64_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==}"

ADMIN_BOOTSTRAP_EMAIL: admin@hok-wiki.local
ADMIN_BOOTSTRAP_PASSWORD: password12345
ADMIN_BOOTSTRAP_FULL_NAME: Local Admin
